<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Formulário de Inscrição, CSS, HTML">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Um Formulário simples de Inscrição">
    <meta http-equiv="X-UA-Compatible" content="IE=7">
    <meta name="author" content="Guilherme dos Santos Oliveira">
    <meta name="robots" content="index, follow">
    <title>Formulário de Inscrição</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <main>
        <article>
            <div class="form-container">
                <h2 class="form-title">Inscreva-se na Nossa Newsletter</h2>
                <p class="form-subtitle">Receba as últimas notícias e ofertas diretamente no seu e-mail</p>
                
                <form>
                    <div class="form-group">
                        <label for="name">Nome</label>
                        <input type="name" id="name" name="user_name" placeholder="Digite seu Nome">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="user_email" placeholder="seu.email@exemplo.com">
                    </div>

                    <div class="form-group">
                        <label for="mensagem"Mensagem:></label>
                        <textarea id="mensagem" name="mensagem" rows="4" cols="50"></textarea>
                    </div>
                    <div class="form-group checkbox-group checkbox-aligned" >
                         <label for="checkbox">Eu aceito os termos e condiçoes</label>
                         <input type="checkbox" id="checkbox" name="checkbox" value="sim">
                 </div>
                    <button type="submit" class="submit-button">Inscreva-se</button>    
                </form>



            </div>
        </article>
    </main>
    
</body>
</html>
